name: Release APK

# Push a tag like v0.1.0 and this builds a signed release APK and publishes it as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: Name the artifact
        run: cp app/build/outputs/apk/release/app-release.apk "cuelet-${{ github.ref_name }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Cuelet ${{ github.ref_name }}"
          files: cuelet-*.apk
          body: |
            **Cuelet ${{ github.ref_name }}** — iPhone-style automations for Android, with **no root**.

            Download the APK below and open it (allow *"install unknown apps"* for your browser/files app if
            prompted). Requires **Android 14+** — see
            [device support](https://github.com/DogT1/cuelet/blob/main/COMPATIBILITY.md).
