name: Release APK

# Push a tag like v0.1.0 and this builds a signed release APK and publishes it as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || \
            "$SDKMGR" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: Name the artifact
        run: cp app/build/outputs/apk/release/app-release.apk "cuelet-${{ github.ref_name }}.apk"

      - name: Build release notes from CHANGELOG
        run: |
          TAG="${{ github.ref_name }}"
          # Pull this version's section (everything under "## <tag>" up to the next "## ").
          awk -v tag="$TAG" '
            index($0, "## " tag) == 1 { grab=1; next }
            grab && /^## / { grab=0 }
            grab { print }
          ' CHANGELOG.md | sed '/./,$!d' > RELEASE_BODY.md
          # Trim trailing blank lines; fall back to a minimal body if the section is missing.
          if [ ! -s RELEASE_BODY.md ]; then
            printf '**Cuelet %s**\n' "$TAG" > RELEASE_BODY.md
          fi
          cat >> RELEASE_BODY.md <<'EOF'

---
**Install:** download the APK below and open it (allow *"install unknown apps"* if prompted). Requires
**Android 14+** — see [device support](https://github.com/DogT1/cuelet/blob/main/COMPATIBILITY.md).
EOF
          echo "----- release body -----"; cat RELEASE_BODY.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Cuelet ${{ github.ref_name }}"
          files: cuelet-*.apk
          body_path: RELEASE_BODY.md
